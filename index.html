<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Timetable</title>
<meta name="description" content="Personal class and study timetable">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1420" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Timetable">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div>
    <h1>My Timetable</h1>
    <p class="sub" id="sub"></p>
  </div>
  <button id="install" type="button" hidden>Install</button>
</header>

<main id="view" aria-live="polite"></main>

<nav class="tabs" role="tablist" aria-label="Timetable views">
  <button type="button" role="tab" data-tab="today" aria-selected="true">Today</button>
  <button type="button" role="tab" data-tab="classes" aria-selected="false">Classes</button>
  <button type="button" role="tab" data-tab="study" aria-selected="false">Study</button>
</nav>

<noscript><p style="padding:16px">This app needs JavaScript to show your timetable.</p></noscript>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
